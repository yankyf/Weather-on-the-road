<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather on the Road</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <header>
            <h1>Weather on the Road</h1>
            <p class="subtitle">See the weather along your entire trip</p>
        </header>

        <div id="api-key-banner" class="api-key-banner hidden">
            <p>To use Google Maps, enter your API key below. It's saved in your browser only.</p>
            <div class="api-key-row">
                <input type="text" id="api-key-input" placeholder="Paste your Google Maps API key" />
                <button id="save-api-key">Save & Reload</button>
            </div>
            <p class="api-key-help">
                Get a free key at <a href="https://console.cloud.google.com/apis/credentials" target="_blank">Google Cloud Console</a>
                — enable "Maps JavaScript API", "Places API", and "Directions API".
            </p>
        </div>

        <div class="controls">
            <div class="input-group">
                <label for="origin">Starting Point</label>
                <input type="text" id="origin" placeholder="e.g. New York, NY" />
            </div>
            <div class="input-group">
                <label for="destination">Destination</label>
                <input type="text" id="destination" placeholder="e.g. Boston, MA" />
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label for="departure-date">Departure Date</label>
                    <input type="date" id="departure-date" />
                </div>
                <div class="input-group">
                    <label for="departure-time">Departure Time</label>
                    <input type="time" id="departure-time" value="08:00" />
                </div>
            </div>
            <button id="plan-trip">Plan My Trip</button>
            <div id="error-message" class="error hidden"></div>
        </div>

        <div id="results" class="hidden">
            <div id="map"></div>
            <div id="weather-timeline">
                <h2>Weather Along Your Route</h2>
                <div id="timeline-cards"></div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_MAPS_API_KEY = localStorage.getItem('gmaps_api_key') || '';
        if (GOOGLE_MAPS_API_KEY) {
            const s = document.createElement('script');
            s.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places&callback=initApp`;
            s.async = true;
            document.head.appendChild(s);
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
