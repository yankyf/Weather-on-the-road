<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather on the Road</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <header>
            <h1>Weather on the Road</h1>
        </header>

        <div id="api-key-banner" class="api-key-banner hidden">
            <p>To use this app, enter your Google Maps API key below. It's saved in your browser only.</p>
            <div class="api-key-row">
                <input type="text" id="api-key-input" placeholder="Paste your Google Maps API key" />
                <button id="save-api-key">Save & Reload</button>
            </div>
            <p class="api-key-help">
                Get a free key at <a href="https://console.cloud.google.com/apis/credentials" target="_blank">Google Cloud Console</a>
                &mdash; enable <strong>Maps JavaScript API</strong>, <strong>Places API</strong>, and <strong>Directions API</strong>.
            </p>
        </div>

        <div id="main-content" class="hidden">
            <div id="map-container">
                <div id="map"></div>
                <div id="search-panel">
                    <div class="search-field">
                        <label>From</label>
                        <input type="text" id="origin" placeholder="Search starting point..." autocomplete="off" />
                    </div>
                    <div class="search-field">
                        <label>To</label>
                        <input type="text" id="destination" placeholder="Search destination..." autocomplete="off" />
                    </div>
                    <div class="search-row">
                        <div class="search-field small">
                            <label>Date</label>
                            <input type="date" id="departure-date" />
                        </div>
                        <div class="search-field small">
                            <label>Time</label>
                            <input type="time" id="departure-time" value="08:00" />
                        </div>
                    </div>
                    <button id="plan-trip">Go</button>
                </div>
            </div>
            <div id="error-message" class="error hidden"></div>
            <div id="weather-timeline" class="hidden">
                <h2>Weather Along Your Route</h2>
                <div id="timeline-cards"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const GOOGLE_MAPS_API_KEY = localStorage.getItem('gmaps_api_key') || '';
        if (GOOGLE_MAPS_API_KEY) {
            const s = document.createElement('script');
            s.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places&callback=initApp`;
            s.async = true;
            s.onerror = function() {
                document.getElementById('error-message').textContent = 'Failed to load Google Maps. Check your API key and make sure Maps JavaScript API and Places API are enabled.';
                document.getElementById('error-message').classList.remove('hidden');
            };
            document.head.appendChild(s);
        }
    </script>
</body>
</html>
