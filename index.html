<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RouteRadar — Weather Along Your Journey</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="side-panel">
        <div id="panel-header">
            <div class="brand">
                <span class="brand-icon">
                    <img src="favicon.svg" alt="RouteRadar" width="32" height="32" />
                </span>
                <span class="brand-text">RouteRadar</span>
                <span class="brand-tagline">Weather Along Your Journey</span>
            </div>
            <div class="travel-mode-row">
                <button class="travel-mode-btn active" data-mode="DRIVING" title="Driving">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
                </button>
                <button class="travel-mode-btn" data-mode="MOTORCYCLE" title="Motorcycle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.44 9.03L15.41 5H11v2h3.59l2 2H5c-2.8 0-5 2.2-5 5s2.2 5 5 5c2.46 0 4.45-1.69 4.9-4h1.65l2.77-2.77c-.21.54-.32 1.14-.32 1.77 0 2.8 2.2 5 5 5s5-2.2 5-5c0-2.65-1.97-4.77-4.56-4.97zM7.82 15C7.4 16.15 6.28 17 5 17c-1.63 0-3-1.37-3-3s1.37-3 3-3c1.28 0 2.4.85 2.82 2H5v2h2.82zM19 17c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/></svg>
                </button>
                <button class="travel-mode-btn" data-mode="BICYCLING" title="Cycling">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM5 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.93 0-3.5-1.57-3.5-3.5S3.07 13.5 5 13.5s3.5 1.57 3.5 3.5S6.93 20.5 5 20.5zm5.8-10l2.4-2.4.8.8c1.3 1.3 3 2.1 5 2.1v-2c-1.4 0-2.5-.5-3.4-1.4L13.4 5.5c-.4-.4-1-.6-1.6-.6s-1.1.2-1.5.6L7.8 8c-.4.4-.6.9-.6 1.4 0 .6.2 1.1.6 1.4L11 13.5V19h2v-6.5l-2.2-2.5zM19 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
                </button>
                <button class="travel-mode-btn" data-mode="WALKING" title="Walking">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>
                </button>
            </div>
        </div>

        <div id="search-section">
            <div class="search-card">
                <div class="search-inputs">
                    <div id="all-stops">
                        <div class="search-input-row stop-row" draggable="true">
                            <span class="drag-handle" title="Drag to reorder">⠿</span>
                            <div class="input-dot-wrap"><span class="dot stop-dot"></span></div>
                            <input type="text" placeholder="Starting point or click on map" autocomplete="off" />
                            <button class="stop-remove-btn hidden">&times;</button>
                        </div>
                        <div class="search-input-row stop-row" draggable="true">
                            <span class="drag-handle" title="Drag to reorder">⠿</span>
                            <div class="input-dot-wrap"><span class="dot stop-dot"></span><span class="dot-line"></span></div>
                            <input type="text" placeholder="Destination or click on map" autocomplete="off" />
                            <button class="stop-remove-btn hidden">&times;</button>
                        </div>
                    </div>
                    <div class="stops-actions-row">
                        <button id="add-waypoint-btn" class="add-waypoint-btn">+ Add stop</button>
                        <button id="my-location-btn" title="Use my location">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
                        </button>
                        <button id="swap-btn" title="Swap first and last stops">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3L5 6.99h3V14h2V6.99h3L9 3z"/></svg>
                        </button>
                    </div>
                </div>

                <div class="departure-mode-row">
                    <div class="departure-toggle">
                        <button id="go-now-btn" class="dep-toggle-btn active">Go now</button>
                        <button id="pick-time-btn" class="dep-toggle-btn">Pick a time</button>
                    </div>
                    <button id="plan-trip">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        Search
                    </button>
                </div>

                <div id="pick-time-section" class="hidden">
                    <div class="datetime-inputs">
                        <input type="date" id="departure-date" />
                        <input type="time" id="departure-time" value="08:00" />
                    </div>
                    <div class="departure-slider-row">
                        <span class="slider-label">Depart at</span>
                        <input type="range" id="departure-slider" min="0" max="23" step="1" value="8" />
                        <span id="slider-time-label">8:00 AM</span>
                    </div>
                </div>
            </div>

            <div class="search-extras">
                <label class="toggle-pill">
                    <input type="checkbox" id="toggle-radar" />
                    <span class="pill-text">Radar layer</span>
                </label>
                <button id="best-time-btn" class="best-time-pill" title="Find the best departure time based on weather">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    Best departure time
                </button>
            </div>

            <div id="best-time-result" class="hidden"></div>

            <div id="saved-places">
                <button class="recent-header-btn" id="saved-toggle">
                    <span>Saved places</span>
                    <span class="toggle-arrow saved-arrow">▸</span>
                </button>
                <div id="saved-list" class="recent-collapsed">
                    <div id="saved-places-grid"></div>
                    <div id="saved-add-row">
                        <input type="text" id="saved-name-input" placeholder="Label (e.g. Gym)" />
                        <input type="text" id="saved-addr-input" placeholder="Address" />
                        <button id="saved-add-btn" title="Save place">+</button>
                    </div>
                </div>
            </div>

            <div id="recent-searches" class="hidden">
                <button class="recent-header-btn" id="recent-toggle">
                    <span>Recent</span>
                    <span class="toggle-arrow">▸</span>
                </button>
                <div id="recent-list" class="recent-collapsed"></div>
            </div>
        </div>

        <div id="routes-section" class="hidden">
            <div id="routes-list"></div>
        </div>

        <div id="trip-actions" class="hidden">
            <button id="start-nav-btn" class="action-btn nav-btn" title="Start navigation">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
                Start
            </button>
            <button id="share-trip-btn" class="action-btn" title="Share trip">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                Share
            </button>
            <button id="print-trip-btn" class="action-btn" title="Print trip summary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
                Print
            </button>
        </div>

        <div id="directions-panel" class="hidden"></div>

        <div id="error-message" class="error hidden"></div>
    </div>

    <div id="map"></div>

    <button id="show-full-trip" class="map-fab hidden" title="Show full trip">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15 3l2.3 2.3-2.89 2.87 1.42 1.42L18.7 6.7 21 9V3h-6zM3 9l2.3-2.3 2.87 2.89 1.42-1.42L6.7 5.3 9 3H3v6zm6 12l-2.3-2.3 2.89-2.87-1.42-1.42L5.3 17.3 3 15v6h6zm12-6l-2.3 2.3-2.87-2.89-1.42 1.42 2.89 2.87L15 21h6v-6z"/></svg>
    </button>

    <div id="nav-overlay" class="hidden">
        <div id="nav-top-bar">
            <div id="nav-progress-bar"><div id="nav-progress-fill"></div></div>
            <div id="nav-maneuver">
                <div id="nav-maneuver-icon">
                    <svg viewBox="0 0 24 24" width="36" height="36" fill="white"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
                </div>
                <div id="nav-maneuver-info">
                    <div id="nav-distance-next">--</div>
                    <div id="nav-instruction">Planning route...</div>
                    <div id="nav-road-name"></div>
                </div>
            </div>
            <div id="nav-next-step" class="hidden">
                <span id="nav-next-icon"></span>
                <span id="nav-next-text">Then...</span>
            </div>
        </div>
        <div id="nav-weather-alert" class="hidden">
            <span id="nav-weather-alert-icon"></span>
            <span id="nav-weather-alert-text"></span>
        </div>
        <div id="nav-alert" class="hidden">
            <span id="nav-alert-icon"></span>
            <span id="nav-alert-text"></span>
        </div>
        <div id="nav-speedometer">
            <span id="nav-speedo-value">0</span>
            <span id="nav-speedo-unit">mph</span>
        </div>
        <div id="nav-bottom-bar">
            <div id="nav-stats">
                <div class="nav-stat nav-stat-eta">
                    <span id="nav-eta" class="nav-stat-value">--</span>
                    <span class="nav-stat-label">ETA</span>
                </div>
                <div class="nav-stat-separator"></div>
                <div class="nav-stat">
                    <span id="nav-remaining-time" class="nav-stat-value">--</span>
                    <span class="nav-stat-label">Remaining</span>
                </div>
                <div class="nav-stat-separator"></div>
                <div class="nav-stat">
                    <span id="nav-remaining-dist" class="nav-stat-value">--</span>
                    <span class="nav-stat-label">Distance</span>
                </div>
            </div>
            <div id="nav-bottom-actions">
                <button id="nav-steps-btn" title="View all steps">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#3c4043"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                </button>
                <button id="nav-mute-btn" title="Mute alerts">
                    <svg id="nav-mute-icon" width="20" height="20" viewBox="0 0 24 24" fill="#3c4043"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
                <button id="nav-stop-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M6 6h12v12H6z"/></svg>
                    Stop
                </button>
            </div>
        </div>
        <button id="nav-recenter-btn" class="hidden" title="Recenter">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="#4285f4"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
        </button>
        <div id="nav-weather-strip" class="hidden">
            <span id="nav-weather-icon">--</span>
            <span id="nav-weather-temp">--</span>
            <span id="nav-weather-desc">--</span>
            <span id="nav-weather-wind"></span>
        </div>
        <div id="nav-steps-drawer" class="hidden">
            <div id="nav-steps-drawer-header">
                <span>Upcoming Steps</span>
                <button id="nav-steps-close">&times;</button>
            </div>
            <div id="nav-steps-list"></div>
        </div>
        <div id="nav-arrived" class="hidden">
            <div id="nav-arrived-content">
                <div id="nav-arrived-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#34a853" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01"/><path d="M22 8h.01"/><path d="M15 2h.01"/><path d="M22 20h.01"/><path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12v0c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10"/><path d="m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11v0c-.11.7-.72 1.22-1.43 1.22H17"/><path d="m11 2 .33.82c.34.86-.2 1.82-1.11 1.98v0C9.52 4.9 9 5.52 9 6.23V7"/></svg></div>
                <div id="nav-arrived-title">You have arrived!</div>
                <div id="nav-arrived-address"></div>
                <div id="nav-arrived-stats"></div>
                <button id="nav-arrived-close">Done</button>
            </div>
        </div>
    </div>

    <div id="weather-timeline" class="hidden">
        <div id="timeline-header">
            <h2>Weather Along Your Route</h2>
        </div>
        <div id="weather-chart"></div>
        <div id="timeline-cards"></div>
    </div>

    <script src="app.js"></script>
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA8ml0f--AxASCrSTT9jqgNIU_1JF2yqM4&libraries=places&callback=initApp">
    </script>
</body>
</html>
