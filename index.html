<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather on the Road</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="side-panel">
        <div id="search-section">
            <div class="panel-header">
                <span class="panel-title">Weather on the Road</span>
            </div>
            <div class="search-inputs">
                <div class="search-input-row">
                    <span class="search-dot origin-dot"></span>
                    <input type="text" id="origin" placeholder="Choose starting point..." autocomplete="off" />
                </div>
                <div class="search-input-row">
                    <span class="search-dot dest-dot"></span>
                    <input type="text" id="destination" placeholder="Choose destination..." autocomplete="off" />
                </div>
                <div class="datetime-row">
                    <input type="date" id="departure-date" />
                    <input type="time" id="departure-time" value="08:00" />
                    <button id="plan-trip">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
                <label class="toggle-label">
                    <input type="checkbox" id="toggle-overlays" checked />
                    Show weather on map
                </label>
            </div>
        </div>
        <div id="directions-panel"></div>
        <div id="weather-info-panel" class="hidden">
            <div id="weather-bars-section"></div>
        </div>
        <div id="error-message" class="error hidden"></div>
    </div>

    <div id="map"></div>

    <div id="weather-timeline" class="hidden">
        <h2>Weather Along Your Route</h2>
        <div id="timeline-cards"></div>
    </div>

    <script src="app.js"></script>
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA8ml0f--AxASCrSTT9jqgNIU_1JF2yqM4&libraries=places&callback=initApp">
    </script>
</body>
</html>
