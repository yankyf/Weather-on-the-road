<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather on the Road</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="side-panel">
        <div id="search-section">
            <div class="search-inputs">
                <div class="search-input-row">
                    <div class="input-dot-wrap"><span class="dot origin-dot"></span></div>
                    <input type="text" id="origin" placeholder="Your location (or click map)" autocomplete="off" />
                    <button id="my-location-btn" title="Use my location">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="#5f6368"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
                    </button>
                </div>
                <div class="search-input-row">
                    <div class="input-dot-wrap"><span class="dot dest-dot"></span><span class="dot-line"></span></div>
                    <input type="text" id="destination" placeholder="Destination (or click map)" autocomplete="off" />
                </div>
            </div>
            <div class="search-options-row">
                <div class="datetime-inputs">
                    <input type="date" id="departure-date" />
                    <input type="time" id="departure-time" value="08:00" />
                </div>
                <button id="plan-trip">Search</button>
            </div>
            <label class="toggle-label">
                <input type="checkbox" id="toggle-overlays" checked />
                Show weather icons on map
            </label>
        </div>

        <div id="routes-section" class="hidden">
            <div id="routes-list"></div>
        </div>

        <div id="directions-panel" class="hidden"></div>

        <div id="error-message" class="error hidden"></div>
    </div>

    <div id="map"></div>

    <div id="weather-timeline" class="hidden">
        <div id="timeline-header">
            <h2>Weather Along Your Route</h2>
        </div>
        <div id="timeline-cards"></div>
    </div>

    <script src="app.js"></script>
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA8ml0f--AxASCrSTT9jqgNIU_1JF2yqM4&libraries=places&callback=initApp">
    </script>
</body>
</html>
