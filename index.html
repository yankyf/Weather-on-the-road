<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather on the Road</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <header>
            <h1>Weather on the Road</h1>
        </header>

        <div id="main-content">
            <div id="map-row">
                <div id="search-panel">
                    <div class="search-field">
                        <label>From</label>
                        <input type="text" id="origin" placeholder="Search starting point..." autocomplete="off" />
                    </div>
                    <div class="search-field">
                        <label>To</label>
                        <input type="text" id="destination" placeholder="Search destination..." autocomplete="off" />
                    </div>
                    <div class="search-row">
                        <div class="search-field small">
                            <label>Date</label>
                            <input type="date" id="departure-date" />
                        </div>
                        <div class="search-field small">
                            <label>Time</label>
                            <input type="time" id="departure-time" value="08:00" />
                        </div>
                    </div>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggle-overlays" checked />
                        Show weather icons on map
                    </label>
                    <button id="plan-trip">Go</button>
                </div>
                <div id="map-container">
                    <div id="map"></div>
                </div>
            </div>
            <div id="error-message" class="error hidden"></div>
            <div id="weather-timeline" class="hidden">
                <h2>Weather Along Your Route</h2>
                <div id="timeline-cards"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA8ml0f--AxASCrSTT9jqgNIU_1JF2yqM4&libraries=places&callback=initApp">
    </script>
</body>
</html>
